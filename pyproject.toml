[project]
name = "sinc-amn"
version = "0.1.0"
description = "Microservicio de sincronizacion Auron <-> Maisa/Noxus"
requires-python = ">=3.12"
# Las dependencias se gestionan en el Pipfile/Pipfile.lock (fuente de verdad
# para el build de Docker). Este bloque queda vacio a proposito: se usa
# `pip install -e .` solo para tener el paquete `sinc_amn` instalado en modo
# editable en desarrollo local, no para resolver versiones.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Layout src/: el pipeline de CI corre pytest sin instalar el paquete
# (`pipenv install`/`--dev` solo resuelven el Pipfile, no hacen `pip install
# -e .`), asi que sin esto `import sinc_amn` falla en collection.
pythonpath = ["src"]
